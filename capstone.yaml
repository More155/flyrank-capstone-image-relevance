# Evaluator manifest — every field is real as of Step 5.

name: image-relevance-auto-tagging

run: ".venv/bin/uvicorn api:app --reload --port 8000"
seed: ".venv/bin/python -m scripts.seed_corpus && .venv/bin/python -m jobs.classify && .venv/bin/python -m jobs.embed_images && .venv/bin/python -m scripts.seed_posts"
test: ".venv/bin/pytest -v"
base_url: "http://localhost:8000"

endpoints:
  - "GET /posts"
  - "GET /images"
  - "GET /posts/{id}/images"
  - "POST /pairings/{id}/review"
  - "GET /pairings"
  - "GET /costs/summary"
  - "GET /review"
